<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="index.js" defer></script>
    <link rel="stylesheet" href="style.css">
    <title> SENAI Dev. Cyber (Gustavo) </title>
</head>

<header>
    <h1> Programação de Aplicativos: Gustavo's Code </h1>
</header>

<body>
    <!-- <h2> Matéria nova!!! 14/09/2026 </h2>
    <h3> Começamos a aprender HTML. </h3> -->
    <div class="divAll">

        <div class="" id="divMenuInicial">
            <button id="btCadastrar" class="" onclick="cadastrar()">Cadastrar-se</button>
            <br>
            <button id="btLogin" class="" onclick="entrar()">Entrar</button>
        </div>

        <div class="escondido" id="divCadastro">
            <h2>Preencha:</h2>
            <input type="text" id="inNomeCadastro" placeholder="digite seu nome">

            <br>
            <input type="password" id="inSenhaCadastro" placeholder="digite sua senha">

            <br>
            <input type="datetime-local" id="inData">

            <br>
            <button id="btSalvarCadastro" onclick="cadastrou()"> Clique aqui para salvar </button>
            <button id="btVoltar" onclick="voltou()"> Voltar </button>
        </div>

        <div class="escondido" id="divLogin">
            <h2>Preencha:</h2>
            <input type="text" id="inNomeLogin" placeholder="digite seu nome">

            <br>
            <input type="password" id="inSenhaLogin" placeholder="digite sua senha">

            <br>
            <button id="btEntrar" onclick="entrou()"> Clique aqui para entrar </button>
            <button id="btVoltar" onclick="voltou()"> Voltar </button>
        </div>

        <div id="divMain" class="escondido">
            <br>
            <h4 id="mensagem">Seja bem-vindo ao Winner's Site!</h4>
            <p id="paragrafo">Selecione sua cor favorita para ficar de plano de fundo!</p>

            <input type="color" id="inCor">

            <br>
            <img id="foto" src="https://github.com/Guustaavo.png" alt="Foto de Perfil do GitHub Guustaavo.">
            <br>
            <button id="btVoltar" onclick="voltou()"> Voltar </button>
        </div>
    </div>

</body>

</html>
