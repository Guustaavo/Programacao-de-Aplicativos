<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="javascript/index.js" defer></script>
    <link rel="stylesheet" href="style/index.css">
    <title>Winners Center</title>
    <link rel="icon" type="image/png" href="imgs/crown.png">
</head>

<!-- <h2> Matéria nova!!! 14/09/2026 </h2>
<h3> Começamos a aprender HTML. </h3> -->

<body>
    <main class="mainAll" id="initialMain">

        <div class="" id="divMenuInicial">
            <aside class="sidebar">
                <img class="imgWinner1" src="imgs/winner.png" alt="Winner">
            </aside>

            <nav class="initialOptions">
                <div class="welcomeMessage">
                    <h1>Olá! Eu sou o</h1>
                    <h1><strong>Winner</strong></h1>
                    <h2>Apenas um dinossauro sonhador</h2>
                </div>

                <div class="initialButtons">
                    <button id="btModalCadastrar" class="" onclick="cadastrar()"><Strong>Cadastrar-se</Strong></button>
                    <button id="btModalLogin" class="" onclick="entrar()"><strong>Entrar</strong></button>
                </div>
            </nav>
        </div>

        <div class="escondido modal" id="modalCadastro">
            <div class="cadastro-content">
                <div class="cadastro-header">
                    <h2>Preencha:</h2>
                    <button id="btVoltar" onclick="voltou()">X</button>
                </div>

                <div class="cadastro-body">
                    <label for="inNomeCadastro">Nome de usuário</label>
                    <input type="text" id="inNomeCadastro" placeholder="crie um nickname...">
                    <label for="inSenhaCadastro">Nova senha</label>
                    <input type="password" id="inSenhaCadastro" placeholder="crie uma senha...">

                    <button id="btSalvarCadastro" onclick="cadastrou()">Clique aqui para salvar</button>
                </div>
            </div>
        </div>

        <div class="escondido modal" id="modalLogin">
            <div class="login-content">
                <div class="login-header">
                    <h2>Login</h2>
                    <button id="btVoltar" onclick="voltou()">X</button>
                </div>

                <div class="login-body">
                    <label for="inNomeLogin">Nome de usuário</label>
                    <input type="text" id="inNomeLogin" placeholder="digite seu nickname...">
                    <label for="inSenhaLogin">Senha</label>
                    <input type="password" id="inSenhaLogin" placeholder="digite sua senha...">

                    <button id="btEntrar" onclick="entrou()">Clique aqui para entrar</button>
                </div>
            </div>
        </div>

        <div class="escondido" id="profile">
            <h4 id="mensagem">Seja bem-vindo ao Winner's Site!</h4>
            <p id="paragrafo">Selecione sua cor favorita para ficar de plano de fundo!</p>

            <input type="color" id="inCor">

            <img class="imgPerfil" src="" alt="Foto de Perfil">
            <button id="btVoltar" onclick="voltou()">Voltar</button>
        </div>
    </main>
</body>

</html>
