<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>InstaDev</title>
    <link rel="icon" type="" href="imgs/insta.png">

    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
</head>

<body>

    <nav class="sidebar">
        <h1 class="logo">InstaDev</h1>

        <nav class="menu">
            <a href="#" class="menu-item">
                <span></span>
                Início
            </a>

            <a href="#" class="menu-item">
                <span></span>
                Pesquisar
            </a>

            <a href="#" class="menu-item">
                <span></span>
                Explorar
            </a>

            <a href="#" class="menu-item">
                <span></span>
                Mensagens
            </a>

            <a href="#" class="menu-item">
                <span></span>
                Notificações
            </a>

            <a href="#" class="menu-item" id="btAbrirModal">
                <span></span>
                Criar
            </a>

            <a href="#" class="menu-item">
                <span></span>
                Perfil
            </a>
        </nav>
    </nav>

    <main class="content">
        <section class="stories">
            <div class="story">
                <div class="story-border">
                    <img src="http://github.com/Guustaavo.png" alt="">
                </div>
            </div>
            <div class="story">
                <div class="story-border">
                    <img src="http://github.com/guilhermeonrails.png" alt="">
                </div>
            </div>
            <div class="story">
                <div class="story-border">
                    <img src="http://github.com/gustavoroberto1.png" alt="">
                </div>
            </div>
            <div class="story">
                <div class="story-border">
                    <img src="http://github.com/Guuiilhermee.png" alt="">
                </div>
            </div>
        </section>

        <section class="feed" id="feed">
            <!-- Posts no javascript. -->
        </section>
    </main>

    <aside class="suggestions">
        <div class="user">
            <img src="https://github.com/Guustaavo.png" alt="instaUser">

            <div class="userName">
                <strong>Guustaavo</strong>
                <span>Gustavo Guimarães</span>
            </div>

            <a href="#">
                Sair
            </a>

        </div>

        <div class="suggestion-title">
            <strong>Sugestões para você</strong>
            <a href="#">Ver todos</a>
        </div>

        <div class="suggestion">
            <img src="https://github.com/NycollasBelchior.png" alt="instaUser">
            <div class="userSuggested">
                <strong>NycollasBelchior</strong>
                <span>Sugestão para você</span>
            </div>
            <a href="#">Seguir</a>
        </div>
        <div class="suggestion">
            <img src="https://github.com/kassianeluizadias13-art.png" alt="instaUser">
            <div class="userSuggested">
                <strong>kassianeluizadias13-art</strong>
                <span>Sugestão para você</span>
            </div>
            <a href="#">Seguir</a>
        </div>
    </aside>

    <div class="modal hidden" id="modalPost">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Nova publicação</h2>
                <button id="btFecharModal">X</button>
            </div>

            <div class="modal-body">
                <label for="inImgPost">URL da imagem</label>
                <input type="text" id="inImgPost" placeholder="https://...">

                <label for="inLegendPost">Legenda</label>
                <textarea type="text" id="inLegendPost" placeholder="Digite a legenda..."></textarea>

                <button class="btPublicar" id="btPublicar">Publicar</button>
            </div>

        </div>

    </div>

    <script src="index.js"> </script>
</body>

</html>
