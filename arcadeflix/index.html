<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcadeflix</title>
    <link rel="stylesheet" href="css/index.css">
    <link rel="icon" type="image/x-icon" href="imgs/arcadeflix.png">
    <script src="js/index.js" defer></script>
</head>

<body>
    <header>
        <h1>🎮 Arcade<span>Flix</span></h1>
        <div>
            <button id="btCadastrarJogo" onclick="cadastrarJogo()">Adicionar novo jogo</button>
            <a href="#catalogo">Jogos</a>
        </div>
    </header>

    <main>
        <section class="banner">
            <div>
                <h2>Encontre seu próximo jogo!</h2>
                <p>Explore nosso catálogo e descubra novas aventuras.</p>
                <a href="#catalogo" class="botao">Ver jogos</a>
            </div>
            <div class="banner-emoji">🕹️</div>
        </section>

        <section class="catalogo" id="catalogo">
            <h2>Catálogo de jogos</h2>
            <div class="filtros">
                <input id="busca" type="search" placeholder="🔍 Pesquisar jogo">
                <div class="categoria">
                    <button class="ativo" data-categoria="Todos">Todos</button>
                    <button data-categoria="Aventura">Aventura</button>
                    <button data-categoria="Corrida">Corrida</button>
                    <button data-categoria="Estratégia">Estratégia</button>
                </div>
            </div>

            <div class="modal hidden" id="modalCadastroJogo">
                <div class="cadastroJogo-content">
                    <div class="cadastroJogo-header">
                        <h2>Cadastrar Jogo</h2>
                        <button id="btVoltar" class="" onclick="voltouJogo()">X</button>
                    </div>

                    <div class="cadastro-body">
                        <label for="inNomeJogo">Nome</label>
                        <input type="text" id="inNomeJogo" placeholder="Nome do jogo...">
                        <label for="inCategoriaJogo">Categoria</label>
                        <input type="text" id="inCategoriaJogo" placeholder="Categoria do jogo...">
                        <label for="inDescricaoJogo">Descrição</label>
                        <input type="text" id="inDescricaoJogo" placeholder="Descrição do jogo...">
                        <label for="inEmojiJogo">Emoji</label>
                        <input type="text" id="inEmojiJogo" placeholder="Emoji do jogo...">
                        <label for="inCorJogo">Cor</label>
                        <input type="color" id="inCorJogo" placeholder="Cor do jogo...">

                        <button id="btSalvarJogo" onclick="cadastrouJogo()">Clique aqui para salvar</button>
                    </div>
                </div>
            </div>

            <div id="grade-jogos" class="grade-jogos" hidden>Nenhum jogo encontrado</div>
        </section>
    </main>
</body>

</html>
